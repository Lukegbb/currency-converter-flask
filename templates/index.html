<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow-lg p-4">
            <h1 class="text-center text-primary mb-4">Currency Converter</h1>

            <form id="convert-form" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="amount" class="form-label">Amount</label>
                    <input type="number" id="amount" class="form-control" min="0.01" step="0.01" value="100" required>
                </div>
                <div class="col-md-3">
                    <label for="base-currency" class="form-label">From</label>
                    <select id="base-currency" class="form-select">
                        {% for c in currencies %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-2 text-center">
                    <button type="button" id="swap" class="btn btn-outline-secondary w-100" title="Swap currencies">&#8646;</button>
                </div>
                <div class="col-md-4">
                    <label for="target-currency" class="form-label">To</label>
                    <select id="target-currency" class="form-select">
                        {% for c in currencies %}<option value="{{ c }}" {% if c == 'USD' %}selected{% endif %}>{{ c }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-lg btn-success">Convert</button>
                </div>
            </form>

            <div class="mt-4 text-center">
                <h2 id="result"></h2>
                <p id="rate" class="text-muted mb-0"></p>
                <p id="error-message" class="text-danger"></p>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <h3 class="h5 mb-0">Recent conversions</h3>
                <button type="button" id="clear-history" class="btn btn-sm btn-link">Clear</button>
            </div>
            <ul id="conversion-history" class="list-group mt-2"></ul>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);
        const HISTORY_KEY = 'conversion-history';

        function loadHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
        }

        function renderHistory() {
            const list = $('conversion-history');
            list.innerHTML = '';
            loadHistory().forEach((text) => {
                const li = document.createElement('li');
                li.className = 'list-group-item';
                li.textContent = text;
                list.appendChild(li);
            });
        }

        function addToHistory(text) {
            const items = [text, ...loadHistory()].slice(0, 10);
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items)); } catch {}
            renderHistory();
        }

        $('swap').addEventListener('click', () => {
            [$('base-currency').value, $('target-currency').value] = [$('target-currency').value, $('base-currency').value];
        });

        $('clear-history').addEventListener('click', () => {
            try { localStorage.removeItem(HISTORY_KEY); } catch {}
            renderHistory();
        });

        $('convert-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            $('error-message').textContent = '';
            try {
                const res = await fetch('/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        base: $('base-currency').value,
                        target: $('target-currency').value,
                        amount: $('amount').value,
                    }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Conversion failed.');

                const fmt = (n, c) => new Intl.NumberFormat('en-IE', { style: 'currency', currency: c }).format(n);
                const text = `${fmt(data.amount, data.base)} = ${fmt(data.converted_amount, data.target)}`;
                $('result').textContent = text;
                $('rate').textContent = `1 ${data.base} = ${data.rate.toFixed(4)} ${data.target}`;
                addToHistory(text);
            } catch (err) {
                $('result').textContent = '';
                $('rate').textContent = '';
                $('error-message').textContent = err.message;
            }
        });

        renderHistory();
    </script>
</body>
</html>
